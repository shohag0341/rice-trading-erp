<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses - Rice Trading ERP Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/farmers.css">
<link rel="stylesheet" href="css/purchases.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-content">
        <header class="top-header" id="topHeader"></header>

        <main class="page-content">
            <div class="toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search by description...">
                </div>
                <button class="btn-primary" id="addExpenseBtn">
                    <i class="fa-solid fa-plus"></i> Add Expense
                </button>
            </div>

            <div class="data-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Warehouse</th>
                            <th>Description</th>
                            <th>Amount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="expensesTableBody">
                        <tr><td colspan="6" class="table-empty">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<!-- Add/Edit Expense Modal -->
<div class="modal-overlay" id="expenseModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modalTitle">Add Expense</h3>
            <button class="modal-close" id="modalCloseBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <form id="expenseForm">
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group-modal">
                        <label for="expenseDate">Date *</label>
                        <input type="date" id="expenseDate" required>
                    </div>
                    <div class="form-group-modal">
                        <label for="expenseCategory">Category *</label>
                        <select id="expenseCategory" required>
                            <option value="fuel">Fuel</option>
                            <option value="truck">Truck</option>
                            <option value="food">Food</option>
                            <option value="labour">Labour</option>
                            <option value="warehouse_rent">Warehouse Rent</option>
                            <option value="repair">Repair</option>
                            <option value="electricity">Electricity</option>
                            <option value="miscellaneous">Miscellaneous</option>
                        </select>
                    </div>
                </div>

                <div class="form-group-modal">
                    <label for="expenseWarehouse">Warehouse (optional)</label>
                    <select id="expenseWarehouse"><option value="">Loading...</option></select>
                </div>

                <div class="form-row">
                    <div class="form-group-modal">
                        <label for="expenseAmount">Amount (৳) *</label>
                        <input type="number" id="expenseAmount" step="0.01" min="0" required>
                    </div>
                    <div class="form-group-modal">
                        <label for="expensePaymentMethod">Payment Method</label>
                        <select id="expensePaymentMethod">
                            <option value="cash">Cash</option>
                            <option value="bank">Bank</option>
                            <option value="mobile_banking">Mobile Banking</option>
                        </select>
                    </div>
                </div>

                <div class="form-group-modal">
                    <label for="expenseDescription">Description</label>
                    <textarea id="expenseDescription" rows="2" placeholder="What was this expense for?"></textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                <button type="submit" class="btn-primary" id="submitBtn">Save Expense</button>
            </div>
        </form>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module" src="js/expenses.js"></script>
</body>
</html>
