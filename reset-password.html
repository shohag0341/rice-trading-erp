<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rice Trading ERP Pro - Reset Password</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- App CSS -->
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <i class="fa-solid fa-key"></i>
        </div>
        <div class="login-title">Reset Password</div>
        <div class="login-subtitle" id="pageSubtitle">Enter a new password for your account</div>

        <!-- Shown while we verify the reset link -->
        <div id="checkingState" style="text-align:center; color:rgba(255,255,255,0.85); padding:10px 0 4px;">
            <span class="spinner"></span> Verifying reset link...
        </div>

        <!-- Shown if the link is invalid/expired -->
        <div id="invalidState" style="display:none; text-align:center;">
            <div style="color:#fecaca; font-size:13px; margin-bottom:18px; line-height:1.6;">
                This reset link is invalid or has expired. Please request a new one from the login page.
            </div>
            <a href="index.html" class="btn-login" style="text-decoration:none; display:inline-flex;">Back to Login</a>
        </div>

        <!-- The actual reset form -->
        <form id="resetForm" style="display:none;">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="newPassword" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmPassword" placeholder="Re-enter new password" required autocomplete="new-password" minlength="6">
                </div>
                <div class="error-text" id="errorText"></div>
            </div>

            <button type="submit" class="btn-login" id="resetBtn">
                <span id="resetBtnText">Set New Password</span>
            </button>
        </form>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module" src="js/reset-password.js"></script>
</body>
</html>
