<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyer Profile - Rice Trading ERP Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/farmers.css">
<link rel="stylesheet" href="css/purchases.css">
<link rel="stylesheet" href="css/profile.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-content">
        <header class="top-header" id="topHeader"></header>

        <main class="page-content">
            <a href="buyers.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Buyers</a>

            <div class="profile-header" id="profileHeader">
                <div class="skeleton" style="width:100%; height:64px;"></div>
            </div>

            <div class="balance-cards" id="balanceCards"></div>

            <div class="card-box">
                <div class="card-box-title">Sales History</div>
                <div id="salesHistoryTable">
                    <div class="table-empty"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Payment Modal -->
<div class="modal-overlay" id="paymentModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Collect Payment</h3>
            <button class="modal-close" id="paymentModalClose"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <form id="paymentForm">
            <div class="modal-body">
                <div class="form-group-modal">
                    <label>Outstanding Due</label>
                    <div id="paymentDueAmount" style="font-size:20px; font-weight:800; color:var(--color-danger);">৳0</div>
                </div>

                <div class="form-group-modal">
                    <label for="paymentAmount">Payment Amount (৳) *</label>
                    <input type="number" id="paymentAmount" step="0.01" min="0.01" required>
                </div>

                <div class="form-group-modal">
                    <label for="paymentMethodSelect">Payment Method</label>
                    <select id="paymentMethodSelect">
                        <option value="cash">Cash</option>
                        <option value="bank">Bank</option>
                        <option value="mobile_banking">Mobile Banking</option>
                    </select>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="paymentCancelBtn">Cancel</button>
                <button type="submit" class="btn-primary" id="paymentSubmitBtn">Record Payment</button>
            </div>
        </form>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module" src="js/buyer-profile.js"></script>
</body>
</html>
