<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Rice Trading ERP Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/reports.css">
<style>
    .mini-trend-card { margin-top: 14px; }
    .mini-trend-card:first-of-type { margin-top: 4px; }
    .mini-trend-header { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    .mini-trend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .mini-trend-label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
    .mini-trend-total { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--text-primary); }
</style>
</head>
<body>

<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-content">
        <header class="top-header" id="topHeader"></header>

        <main class="page-content">
            <div class="global-search-wrapper">
                <div class="global-search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="globalSearchInput" placeholder="Search farmers, buyers, invoice no...">
                </div>
                <div class="global-search-results" id="globalSearchResults"></div>
            </div>

            <div class="stats-grid" id="statsGrid">
                <div class="skeleton" style="height:120px;"></div>
                <div class="skeleton" style="height:120px;"></div>
                <div class="skeleton" style="height:120px;"></div>
                <div class="skeleton" style="height:120px;"></div>
                <div class="skeleton" style="height:120px;"></div>
            </div>

            <div class="charts-grid">
                <div class="card-box">
                    <div class="card-box-title" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
                        <span>Purchase / Sales / Profit Trend</span>
                        <div class="quick-range-btns">
                            <button type="button" class="quick-range-btn trend-range-btn" data-range="weekly">Weekly</button>
                            <button type="button" class="quick-range-btn trend-range-btn active" data-range="monthly">Monthly</button>
                            <button type="button" class="quick-range-btn trend-range-btn" data-range="yearly">Yearly</button>
                            <button type="button" class="quick-range-btn trend-range-btn" data-range="alltime">All Time</button>
                        </div>
                    </div>

                    <div class="mini-trend-card">
                        <div class="mini-trend-header">
                            <span class="mini-trend-dot" style="background:#2563eb;"></span>
                            <span class="mini-trend-label">Purchase</span>
                            <span class="mini-trend-total" id="purchaseTrendTotal">৳0</span>
                        </div>
                        <canvas id="purchaseTrendChart" height="55"></canvas>
                    </div>

                    <div class="mini-trend-card">
                        <div class="mini-trend-header">
                            <span class="mini-trend-dot" style="background:#16a34a;"></span>
                            <span class="mini-trend-label">Sales</span>
                            <span class="mini-trend-total" id="salesTrendTotal">৳0</span>
                        </div>
                        <canvas id="salesTrendChart" height="55"></canvas>
                    </div>

                    <div class="mini-trend-card">
                        <div class="mini-trend-header">
                            <span class="mini-trend-dot" style="background:#f97316;"></span>
                            <span class="mini-trend-label">Profit</span>
                            <span class="mini-trend-total" id="profitTrendTotal">৳0</span>
                        </div>
                        <canvas id="profitTrendChart" height="55"></canvas>
                    </div>
                </div>
                <div class="card-box">
                    <div class="card-box-title">Warehouse Utilization</div>
                    <div id="warehouseList"></div>
                </div>
            </div>

            <div class="bottom-grid">
                <div class="card-box">
                    <div class="card-box-title">Top Farmers</div>
                    <div id="topFarmersList"></div>
                </div>
                <div class="card-box">
                    <div class="card-box-title">Top Buyers</div>
                    <div id="topBuyersList"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Floating "+" shortcut: New Purchase / New Sale -->
<div class="fab-wrapper" id="fabWrapper">
    <div class="fab-menu" id="fabMenu">
        <button type="button" class="fab-menu-item" id="fabNewSale">
            <span>New Sale</span>
            <span class="fab-menu-icon bg-green"><i class="fa-solid fa-money-bill-trend-up"></i></span>
        </button>
        <button type="button" class="fab-menu-item" id="fabNewPurchase">
            <span>New Purchase</span>
            <span class="fab-menu-icon bg-blue"><i class="fa-solid fa-cart-shopping"></i></span>
        </button>
    </div>
    <button type="button" class="fab-btn" id="fabToggle"><i class="fa-solid fa-plus"></i></button>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
