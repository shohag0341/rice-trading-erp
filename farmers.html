<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmers - Rice Trading ERP Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/farmers.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-content">
        <header class="top-header" id="topHeader"></header>

        <main class="page-content">
            <div class="toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search by name, phone, or village...">
                </div>
                <button class="btn-primary" id="addFarmerBtn">
                    <i class="fa-solid fa-plus"></i> Add Farmer
                </button>
            </div>

            <div class="data-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Village</th>
                            <th>District</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="farmersTableBody">
                        <tr><td colspan="6" class="table-empty">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<!-- Add/Edit Farmer Modal -->
<div class="modal-overlay" id="farmerModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modalTitle">Add Farmer</h3>
            <button class="modal-close" id="modalCloseBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <form id="farmerForm">
            <div class="modal-body">
                <div class="form-group-modal">
                    <label for="farmerName">Full Name *</label>
                    <input type="text" id="farmerName" placeholder="e.g. Abdul Karim" required>
                </div>

                <div class="form-row">
                    <div class="form-group-modal">
                        <label for="farmerPhone">Phone</label>
                        <input type="text" id="farmerPhone" placeholder="01xxxxxxxxx">
                    </div>
                    <div class="form-group-modal">
                        <label for="farmerNid">NID Number</label>
                        <input type="text" id="farmerNid" placeholder="National ID">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group-modal">
                        <label for="farmerVillage">Village</label>
                        <input type="text" id="farmerVillage" placeholder="Village name">
                    </div>
                    <div class="form-group-modal">
                        <label for="farmerUnion">Union</label>
                        <input type="text" id="farmerUnion" placeholder="Union name">
                    </div>
                </div>

                <div class="form-group-modal">
                    <label for="farmerDistrict">District</label>
                    <input type="text" id="farmerDistrict" placeholder="District name">
                </div>

                <div class="form-group-modal">
                    <label for="farmerRemarks">Remarks</label>
                    <textarea id="farmerRemarks" rows="2" placeholder="Optional notes"></textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                <button type="submit" class="btn-primary" id="submitBtn">Save Farmer</button>
            </div>
        </form>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module" src="js/farmers.js"></script>
</body>
              </html>
