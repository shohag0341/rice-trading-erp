<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Adjustments - Rice Trading ERP Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/farmers.css">
<link rel="stylesheet" href="css/reports.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-content">
        <header class="top-header" id="topHeader"></header>

        <main class="page-content">
            <div class="report-summary-grid" id="summaryGrid"></div>

            <div class="toolbar">
                <div></div>
                <button class="btn-primary" id="addAdjustmentBtn">
                    <i class="fa-solid fa-plus"></i> New Entry
                </button>
            </div>

            <div class="data-table-wrapper">
                <table>
                    <thead>
                        <tr><th>Date</th><th>Type</th><th>Amount</th><th>Reason</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="adjustmentsTableBody">
                        <tr><td colspan="5" class="table-empty">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<!-- Add Adjustment Modal -->
<div class="modal-overlay" id="adjustmentModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Cash Out / Returned</h3>
            <button class="modal-close" id="modalCloseBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <form id="adjustmentForm">
            <div class="modal-body">
                <div class="form-group-modal">
                    <label for="adjustmentType">Type *</label>
                    <select id="adjustmentType" required>
                        <option value="cash_out">Cash Out (taken for other use)</option>
                        <option value="cash_in">Cash Returned (paid back)</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group-modal">
                        <label for="adjustmentAmount">Amount (৳) *</label>
                        <input type="number" id="adjustmentAmount" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group-modal">
                        <label for="adjustmentDate">Date *</label>
                        <input type="date" id="adjustmentDate" required>
                    </div>
                </div>

                <div class="form-group-modal">
                    <label for="adjustmentReason">Reason</label>
                    <textarea id="adjustmentReason" rows="2" placeholder="e.g. Used for personal emergency"></textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                <button type="submit" class="btn-primary" id="submitBtn">Save</button>
            </div>
        </form>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module" src="js/cash-adjustments.js"></script>
</body>
</html>
