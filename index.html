<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rice Trading ERP Pro - Login</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- App CSS -->
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <i class="fa-solid fa-warehouse"></i>
        </div>
        <div class="login-title">Rice Trading ERP Pro</div>
        <div class="login-subtitle">Sign in to manage your business</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <div class="error-text" id="errorText"></div>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" id="rememberMe"> Remember Me
                </label>
                <button type="button" id="forgotPasswordLink" class="link-btn">Forgot Password?</button>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span id="loginBtnText">Sign In</span>
            </button>
        </form>
    </div>
</div>

<!-- Forgot Password modal -->
<div class="fp-modal-overlay" id="fpModalOverlay">
    <div class="fp-modal-card">
        <button type="button" class="fp-modal-close" id="fpModalClose"><i class="fa-solid fa-xmark"></i></button>

        <div class="login-logo" style="margin-bottom:14px;">
            <i class="fa-solid fa-key"></i>
        </div>
        <div class="login-title" style="font-size:18px;">Reset Your Password</div>
        <div class="login-subtitle">Enter your account email — we'll send you a reset link</div>

        <form id="fpForm">
            <div class="form-group">
                <label for="fpEmail">Email</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="fpEmail" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="error-text" id="fpErrorText"></div>
            </div>

            <button type="submit" class="btn-login" id="fpSendBtn">
                <span id="fpSendBtnText">Send Reset Link</span>
            </button>
        </form>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="module" src="js/login.js"></script>
</body>
</html>
